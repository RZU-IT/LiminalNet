[package]
name = "liminalnet"
version = "0.1.0"
edition = "2024"
description = "Interactive network traffic monitor by RZU Informatique"
license-file = "LICENSE"
repository = "https://github.com/RZU-IT/LiminalNet"
publish = false
autobins = false

[[bin]]
name = "liminalnet-core"
path = "src/main.rs"

[[bin]]
name = "liminalnet"
path = "src/launcher.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
pcap = "2.5"
etherparse = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
sysinfo = "0.37"
listeners = "0.6"
dns-lookup = "3"
ipnet = "2"
maxminddb = "0.32"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
unicode-width = "0.2"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true
